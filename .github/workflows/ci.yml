# Minimal CI safety gate (brief Phase 12).
#
# Goal: protect the research baseline (106+ tests) before and during
# production-hardening refactors. This workflow is intentionally conservative:
# lint / typecheck / build steps use `npm run <script> --if-present`, so they run
# when those scripts exist and are a no-op success when they do not. That means
# adding a linter later needs no workflow change, and the pipeline never fails
# merely because a tool/config is not configured yet.
#
# Currently NOT configured in this repo (documented, not invented):
#   - lint      : no `lint` npm script (no ESLint config present)
#   - typecheck : no `typecheck` npm script (project is CommonJS JS, no TS yet)
#   - build     : no `build` npm script (no bundling/compilation step)
# These will activate automatically once the corresponding npm scripts are added.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & static checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the research reproducibility baseline (v22.22.2); 20 guards the
        # README's stated "Node 18+" compatibility floor.
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Lint (if configured)
        run: npm run lint --if-present

      - name: Typecheck (if configured)
        run: npm run typecheck --if-present

      - name: Build (if applicable)
        run: npm run build --if-present

      - name: Run test suite
        # Tests degrade gracefully without Ollama/ChromaDB (they exercise the
        # fallback paths), so no services are needed in CI.
        run: npm test

  security:
    name: Security scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (full history for secret scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability scan (informational)
        # Informational: transitive deps in the ChromaDB/embedding chain carry
        # known advisories that are not in the app's control surface. This
        # surfaces them without blocking the safety gate. Tighten to a hard
        # failure once the dependency tree is under production control.
        run: npm audit --audit-level=high || true
        continue-on-error: true

      - name: Secret scan (gitleaks)
        # Hard gate: a detected secret fails the build. Uses the MIT-licensed
        # gitleaks CLI directly (no Action license needed for private repos).
        env:
          GITLEAKS_VERSION: "8.18.4"
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1
